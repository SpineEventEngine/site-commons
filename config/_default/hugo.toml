baseURL = 'https://spine.io/'
languageCode = 'en-us'
title = 'Spine Event Engine'
disableKinds = ['taxonomy', 'term']

[module]
  # Sites using an older Hugo get a warning. Keep in sync with the `README.md`.
  [module.hugoVersion]
    min = '0.169.0'
  [[module.imports]]
    path = 'github.com/gohugoio/hugo-mod-bootstrap-scss/v5'

# Enables HTML rendering in markdown files.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    noClasses = false
