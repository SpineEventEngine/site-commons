<!--
  Renders a visual separator in the side navigation.

  The separator can be displayed as a divider line or spacing,
  depending on the specified type.

  Usage:
  ```yml
  - separator: space
  ```
-->

{{ $separator := .separator }}

{{ $allowed := slice
    "line"
    "space"
}}

{{ if not (in $allowed $separator) }}
    {{ errorf "Invalid sidenav separator type %q. Must be one of: %s." $separator (delimit $allowed ", ") }}
{{ end }}

{{ if eq $separator "line" }}
    <hr class="sidenav-separator line"/>
{{ else if eq $separator "space" }}
    <div class="sidenav-separator space"></div>
{{ end }}
