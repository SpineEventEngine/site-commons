<!--
Parses the shortcode value that is used in HTML or in Data files.

In the final result, removes the extra spaces.
-->
{{ $value := . }}
{{ if hasPrefix $value "{{<" }}
    {{ $value = $value | markdownify }}
    {{ $value = strings.TrimSpace $value }}
{{ end }}
{{ return $value }}
