<!--
Checks if the provided URL is in the `data/whitelist.yml`
and should not receive the `rel="nofollow"` property.
-->

{{ $url := . }}
{{ $whitelist := hugo.Data.whitelist.domains }}
{{ $skipNofollow := false }}
{{ if and $url (hasPrefix $url "http") }}
    {{ range $whitelist }}
        {{ if strings.Contains $url . }}
            {{ $skipNofollow = true }}
        {{ end }}
    {{ end }}
{{ end }}
{{ return $skipNofollow }}
