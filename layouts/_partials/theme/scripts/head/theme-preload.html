<!--
Applies the saved theme to the document before first paint.
Needed to prevent a flash of the default theme during page load or navigation.
-->
<script>
    (function () {
        var themeCookieMatch = document.cookie.match(/(?:^|;\s*)themeColor=(light|dark)(?:;|$)/);
        var theme = themeCookieMatch ? themeCookieMatch[1] : null;
        if (theme) {
            document.documentElement.setAttribute('data-theme', theme);
        }
    })();
</script>
